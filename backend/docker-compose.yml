services:
  postgres:
    image: postgres:16-alpine
    container_name: edu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu123
      POSTGRES_DB: edu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: edu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: edu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: http://host.docker.internal:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  kkfileview:
    image: keking/kkfileview:latest
    container_name: edu-kkfileview
    restart: unless-stopped
    ports:
      - "8012:8012"

volumes:
  postgres_data:
  redis_data:
  minio_data:
