spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:edu}
    username: ${DB_USERNAME:edu}
    password: ${DB_PASSWORD:edu123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

jwt:
  secret: ${JWT_SECRET:changeme-dev-only-do-not-use-in-production}
  expiration: 86400000

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:edu}

kkfileview:
  base-url: ${KKFILEVIEW_BASE_URL:http://localhost:8012}

logging:
  level:
    com.example.edu: ${APP_LOG_LEVEL:info}
    org.springframework.security: ${SECURITY_LOG_LEVEL:warn}
